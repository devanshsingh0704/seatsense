name: tests

on:
  push:
  pull_request:

# read-only: the jobs only check out and test the code
permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # the unit tests need no GPU, torch or camera
      - run: pip install numpy opencv-python-headless
      - run: python -m unittest discover -s tests -t .

  privacy-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # every commit, not just the latest
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m scripts.privacy_check --history
      # security linter: fail on medium or high findings
      - run: pip install bandit && bandit -q -r seatsense training labelling scripts -ll
