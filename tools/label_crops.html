<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sitting or Standing</title>
<style>
  :root { --bg:#0e1014; --panel:#161920; --panel2:#1d212a; --line:#2a2f3a; --text:#e7e9ee; --dim:#8a93a4;
          --sit:#3ecf8e; --stand:#f5a524; --unc:#8a93a4; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:12px; padding:12px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  h1 { font-size:16px; margin:0; }
  .spacer { flex:1; }
  .progress { color:var(--dim); } .progress b { color:var(--text); }
  .bar { height:4px; background:var(--panel2); } .bar i { display:block; height:100%; background:var(--accent); width:0; }
  main { display:flex; flex-direction:column; align-items:center; padding:16px; gap:14px; }
  .crop { height:min(58vh, 520px); max-width:100%; display:flex; align-items:center; justify-content:center;
          background:#000; border:1px solid var(--line); border-radius:10px; padding:6px; }
  .crop img { max-height:100%; max-width:100%; image-rendering:auto; }
  .meta { color:var(--dim); font-size:13px; text-align:center; }
  .meta b { color:var(--text); }
  .answers { display:flex; gap:10px; flex-wrap:wrap; justify-content:center; }
  .ans { min-width:150px; padding:12px 18px; border-radius:10px; border:2px solid var(--line); background:var(--panel);
         color:var(--text); font:600 16px system-ui; cursor:pointer; }
  .ans kbd { display:inline-block; margin-left:8px; padding:0 6px; border:1px solid var(--line); border-radius:4px; font-size:12px; color:var(--dim); }
  .ans.sit.on { border-color:var(--sit); background:rgba(62,207,142,.15); }
  .ans.stand.on { border-color:var(--stand); background:rgba(245,165,36,.15); }
  .ans.unclear.on { border-color:var(--unc); background:rgba(138,147,164,.15); }
  .hint { color:var(--dim); font-size:12px; text-align:center; max-width:640px; }
  .nav { display:flex; gap:8px; }
  button.btn { background:var(--panel); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 12px; font:inherit; cursor:pointer; }
  #status { color:var(--dim); font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>Sitting or standing?</h1>
  <span class="spacer"></span>
  <span class="progress" id="progress"></span>
</header>
<div class="bar"><i id="bar"></i></div>
<main>
  <div class="crop"><img id="img" alt="person crop"></div>
  <div class="meta" id="meta"></div>
  <div class="answers">
    <button class="ans sit" data-a="sit">Sitting<kbd>S</kbd></button>
    <button class="ans stand" data-a="stand">Standing<kbd>T</kbd></button>
    <button class="ans unclear" data-a="unclear">Unclear<kbd>U</kbd></button>
  </div>
  <div class="nav">
    <button class="btn" id="prev">← Back</button>
    <button class="btn" id="accept">Accept highlighted (Enter)</button>
  </div>
  <p class="hint">Judge the <b>centre person</b> only. Sitting = on a chair, even if turned away or chatting. Standing = on their feet, even if leaning on a desk.
    Use Unclear if you can't tell (mostly hidden, cut off, or not a person).</p>
  <span id="status"></span>
</main>
<script>
const $ = (id) => document.getElementById(id);
let crops = [], labels = {}, i = 0;

function show() {
  const c = crops[i], cur = labels[c.file] || c.guess;
  $("img").src = `/img/${c.file}`;
  $("meta").innerHTML = `${c.cam.toUpperCase()} · ${Math.floor(c.t / 60)}:${String(c.t % 60).padStart(2, "0")} into the recording · near box <b>${c.box}</b> · ` +
    (labels[c.file] ? `your answer: <b>${labels[c.file]}</b>` : `model's guess: <b>${c.guess}</b> (not checked yet)`);
  document.querySelectorAll(".ans").forEach(b => b.classList.toggle("on", b.dataset.a === cur));
  const done = Object.keys(labels).length;
  $("progress").innerHTML = `crop <b>${i + 1}</b> / ${crops.length} · checked <b>${done}</b>`;
  $("bar").style.width = `${done / crops.length * 100}%`;
}

async function answer(a) {
  labels[crops[i].file] = a;
  const r = await fetch("/labels", { method: "POST", body: JSON.stringify(labels) });
  $("status").textContent = r.ok ? "saved" : "save failed: " + await r.text();
  if (i < crops.length - 1) i++;
  else $("status").textContent = "all crops checked — saved";
  show();
}

document.querySelector(".answers").onclick = (e) => { const b = e.target.closest(".ans"); if (b) answer(b.dataset.a); };
$("prev").onclick = () => { if (i > 0) { i--; show(); } };
$("accept").onclick = () => answer(labels[crops[i].file] || crops[i].guess);
document.addEventListener("keydown", (e) => {
  const k = e.key.toLowerCase();
  if (k === "s") answer("sit");
  else if (k === "t") answer("stand");
  else if (k === "u") answer("unclear");
  else if (k === "enter") { e.preventDefault(); answer(labels[crops[i].file] || crops[i].guess); }
  else if (k === "arrowleft") { if (i > 0) { i--; show(); } }
});

fetch("/data").then(r => r.json()).then(d => {
  crops = d.crops; labels = d.labels;
  i = Math.max(0, crops.findIndex(c => !labels[c.file]));
  show();
});
</script>
</body>
</html>
